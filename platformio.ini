; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = ~/.platformio/build_cache

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
; Temporary sensor investigation: remove this flag to disable transition logs.
build_flags = -DSENSOR_DIAGNOSTICS
; Runs `pnpm build` before the FS image is packed (buildfs / uploadfs).
extra_scripts = post:scripts/build_frontend.py
lib_deps =
  bblanchon/ArduinoJson
  ESP32Async/ESPAsyncWebServer
  adafruit/Adafruit AMG88xx Library
  pololu/VL53L1X
  
monitor_port = COM7
monitor_speed = 115200

; Hardware acceptance telemetry only; restore esp32dev after measurement.
[env:acceptance_test]
extends = env:esp32dev
build_flags = -DPROGRAM_DIAGNOSTICS -DSENSOR_DIAGNOSTICS

[env:runtime_test]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
test_framework = unity
test_build_src = yes
test_filter = test_runtime
build_src_filter = +<runtime/program.cpp> +<runtime/engine.cpp>
extra_scripts = pre:scripts/prepare_test_fixtures.py
lib_deps = bblanchon/ArduinoJson
upload_port = COM7
test_port = COM7
monitor_speed = 115200
